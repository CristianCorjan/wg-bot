name: wg gesucht

on:
  schedule:
    - cron: "7 6-19 * * *"    # once an hour, 08:00-21:00 German time (UTC+2)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wg
  cancel-in-progress: false

jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Write to new listings
        env:
          WG_EMAIL: ${{ secrets.WG_EMAIL }}
          WG_PASSWORD: ${{ secrets.WG_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wgbot.py --dry-run

      - name: Remember who was contacted
        if: always()
        run: |
          if [[ -n "$(git status --porcelain contacted.sqlite)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contacted.sqlite
            git commit -m "contacted $(date -u +%FT%TZ)"
            git pull --rebase --autostash
            git push
          else
            echo "nothing new"
          fi
